[package]
name = "smocka"
version = "0.1.2"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "2d",
    "ui",
    "serialize",
    # Sound: WAV for the effects `tools/make_sounds.py` writes, Ogg Vorbis for music.
    "bevy_audio",
    "wav",
    "vorbis",
] }
bevy_enhanced_input = { version = "0.27.2", default-features = false, features = [
    "serialize",
] }
rand = "0.10.4"
lightyear = { version = "0.31.0", features = [
    "client",
    "server",
    "replication",
    "prediction",
    "interpolation",
    "input_native",
    "udp",
    "netcode",
] }
serde = { version = "1.0.229", features = ["derive"] }
dirs = "7.0.0"
toml = "1.2.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "smocka"
test = false

[lints.clippy]
# Name module files after their folder (`menu.rs` next to `menu/`), never `mod.rs`.
mod_module_files = "warn"
float_cmp = "warn"
let_underscore_must_use = "warn"
ignored_unit_patterns = "warn"
inefficient_to_string = "warn"
explicit_iter_loop = "warn"
doc_markdown = "warn"
