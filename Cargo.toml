[package]
name = "smocka"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["file_watcher"] }
# rand = "0.10.3"
lightyear = { version = "0.31.0", features = [
    "client",
    "server",
    "replication",
    "prediction",
    "interpolation",
    "input_native",
    "udp",
    "netcode",
] }
serde = { version = "1.0.229", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true


[[bin]]
name = "smocka"
test = false
